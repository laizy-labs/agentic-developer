[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-developer"
version = "1.0.0"
description = "CLI-based developer assistant connecting JIRA via MCP, Git CLIs (gh/glab), and customizable workflow skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Agentic Developer Contributors" }
]
keywords = ["cli", "mcp", "jira", "github", "gitlab", "developer-tools", "agentic", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "flake8>=6.1.0",
    "black>=23.11.0",
]

[project.scripts]
agentic-dev = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
